@keyframes gradientShift {
  0% { background: linear-gradient(135deg, #4e73df, #1cc88a); }
  50% { background: linear-gradient(135deg, #1cc88a, #f6c23e); }

}

#questionText {

}

#answerText {

button {

  cursor: pointer;
  margin: 8px;
  color: white;
  transition: all 0.25s ease;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

/* 🔁 Repeat (neutral) */
button:nth-child(1) {

}

button:nth-child(1):hover {

  transform: translateY(-3px);
}

/* ⏭ Next person (primary action) */
button:nth-child(2) {

}

button:nth-child(2):hover {

}

/* ➡ Next question (navigation) */
button:nth-child(3) {

}

button:nth-child(3):hover {
  background: #364fc7;
  transform: translateY(-3px);
}

.fadeIn {
  animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

canvas {

  top:0;
  left:0;
  pointer-events:none;

// Shuffle answers so order is random
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

questions.forEach(q => shuffleArray(q.answers));

  
// DOM elements
const player = document.getElementById("player");
const questionText = document.getElementById("questionText");
const answerText = document.getElementById("answerText");
const controls = document.getElementById("controls");

// Track indices
let currentQuestionIndex = 0;
let currentPersonIndex = 0;


// Confetti
function launchConfetti() {
  const duration = 2*1000;
  const end = Date.now() + duration;
  (function frame() {
    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
    if (Date.now() < end) requestAnimationFrame(frame);
  }());
}

// Play current answer
function playCurrent() {
  const currentAnswer = questions[currentQuestionIndex].answers[currentPersonIndex];

  player.src = currentAnswer.audio;
  questionText.textContent = questions[currentQuestionIndex].text;
  answerText.textContent = currentAnswer.text;
  controls.style.display = "block";


  // ✨ Glow effect while audio plays
  player.onplay = () => {
    content.style.boxShadow =
      "0 0 40px rgba(255,255,255,0.4), 0 25px 50px rgba(0,0,0,0.25)";
  };

  player.onended = () => {
    content.style.boxShadow =
      "0 25px 50px rgba(0,0,0,0.25)";
  };

  player.play().then(launchConfetti).catch(() => {
    questionText.innerHTML = "<button onclick='playCurrent()'>Begin!</button>";
  });
}



// Repeat current answer
function repeatAudio() {
  player.currentTime = 0;
  player.play();
  launchConfetti();
}

// Next answer
function nextAnswer() {
  currentPersonIndex = (currentPersonIndex + 1) % questions[currentQuestionIndex].answers.length;
  playCurrent();
}

// Next question
function nextQuestion() {
  currentQuestionIndex++;

  if (currentQuestionIndex >= questions.length) {
    currentQuestionIndex = 0; // loop back to start
  }

  currentPersonIndex = 0;

  // 🔥 Trigger fade animation
  content.classList.remove("fadeIn");
  void content.offsetWidth; // forces reflow so animation can restart
  content.classList.add("fadeIn");
  
  playCurrent();
}



// Initial load
playCurrent();
